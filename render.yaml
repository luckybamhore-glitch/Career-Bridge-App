# ============================================================
# Render Blueprint — CareerBridge AI Platform (SINGLE SERVICE)
# ============================================================
# One Node web service runs BOTH:
#   - Express API + Socket.io  (backend/)
#   - Built Vite frontend served by Express (frontend/dist)
#
# HOW TO USE (one-time setup):
#   1. Push this repo to GitHub (don't commit real .env files).
#   2. Render Dashboard -> New -> Blueprint -> select this repo.
#   3. Fill in the secrets it prompts for (MONGO_URI, JWT_SECRET,
#      GEMINI_API_KEY, CLOUDINARY_*). These are marked sync: false
#      so Render asks for them instead of storing values in git.
#   4. That's it — no VITE_* or CLIENT_URL wiring needed, because
#      frontend and backend share one origin. (CLIENT_URL is optional
#      now; set it to your Render URL if you want strict CORS.)
#   5. CI/CD: auto-deploys on every push to `main`
#      (Auto-Deploy is on by default for blueprint services).
# ============================================================

services:
  - type: web
    name: career-bridge-app
    runtime: node
    # Repo root (this file's directory): builds both packages,
    # then starts the backend, which serves frontend/dist.
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      # Render injects PORT automatically — do NOT set it here.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # optional now (same-origin); e.g. https://career-bridge-app.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SOCKET_DEBUG
        value: "off"
